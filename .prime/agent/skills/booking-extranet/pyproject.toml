[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booking-extranet-skill"
version = "0.1.0"
description = "Controlled Booking.com Extranet access for Prime Agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/booking_extranet"]
